[versions]
spotless = "8.10.2"
palantir-java-format = "2.98.0"
errorprone-plugin = "5.1.1"
errorprone = "2.50.0"
nullaway = "0.14.1"
jspecify = "1.0.1"
checkstyle = "14.1.0"
pmd = "7.27.0"
spotbugs = "4.10.4"
spotbugs-plugin = "6.5.11"
findsecbugs = "1.14.0"
jacoco = "0.8.15"
spring-modulith = "2.1.1"
# Same version as the ArchUnit core that spring-modulith 2.1.1 brings transitively (D-107).
archunit = "1.4.2"
# Built against Spring Boot 4.1.0 (D-172).
springdoc = "3.1.1"

[libraries]
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
findsecbugs = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
