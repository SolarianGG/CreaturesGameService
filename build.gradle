plugins {
    id 'java'
    id 'checkstyle'
    id 'pmd'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    alias(libs.plugins.spotless)
    alias(libs.plugins.errorprone)
    alias(libs.plugins.spotbugs)
}

group = 'com.solarianofc'
version = '0.0.1-SNAPSHOT'
description = 'GameService'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom libs.spring.modulith.bom.get().toString()
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
    implementation libs.jspecify
    implementation libs.springdoc.webmvc.ui
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-amqp-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation libs.archunit.junit5
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-rabbitmq'
    testImplementation 'com.redis:testcontainers-redis'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    errorprone libs.errorprone.core
    errorprone libs.nullaway
    spotbugsPlugins libs.findsecbugs
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Werror'
}

tasks.named('compileJava') {
    options.errorprone {
        error('NullAway')
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
    }
}

tasks.named('compileTestJava') {
    options.errorprone.disable('NullAway')
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
    // The OpenAPI snapshot test compares against this file, so a changed snapshot reruns the tests (D-55).
    inputs.files('docs/api/openapi.yaml').withPropertyName('openApiSnapshot').withPathSensitivity(PathSensitivity.RELATIVE)
    // ProfileConfigurationTests compares the local profile with this file (D-210).
    inputs.files('.env.example').withPropertyName('composeEnvExample').withPathSensitivity(PathSensitivity.RELATIVE)
}

// Rewrites docs/api/openapi.yaml from the running application instead of comparing it (D-173).
tasks.register('updateOpenApiSnapshot', Test) {
    description = 'Regenerates the committed OpenAPI snapshot docs/api/openapi.yaml.'
    group = 'documentation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.solarianofc.gameservice.shared.internal.openapi.OpenApiSnapshotTests'
    }
    systemProperty 'openapi.snapshot.update', 'true'
    outputs.upToDateWhen { false }
    // Regeneration only; coverage comes from the test task.
    jacoco.enabled = false
}

checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    maxWarnings = 0
}

pmd {
    toolVersion = libs.versions.pmd.get()
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
    consoleOutput = true
}

spotbugs {
    toolVersion = libs.versions.spotbugs.asProvider().get()
    effort = com.github.spotbugs.snom.Effort.MAX
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
    // Approved exclusions only, each with its reason (D-70, D-168).
    excludeFilter = file('config/spotbugs/exclude.xml')
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

// GameServiceApplication is an entry point without logic; its main() is not called by tests (D-72).
def coverageExclusions = ['com/solarianofc/gameservice/GameServiceApplication.class']

tasks.withType(JacocoReportBase).configureEach {
    classDirectories.setFrom(files(classDirectories.files.collect { fileTree(it) { exclude coverageExclusions } }))
}

tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.60
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// SpotBugs analyzes main sources only (D-71).
tasks.named('spotbugsTest') {
    enabled = false
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat(libs.versions.palantir.java.format.get())
    }
}
