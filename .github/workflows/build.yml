# Full sensor set on a clean machine: see docs/slices/SOL-87-github-actions-ci.md (D-75..D-79).
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The Windows checkout stores gradlew without the executable bit (D-81).
      - name: Build with all sensors
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports
            build/test-results
          retention-days: 7
