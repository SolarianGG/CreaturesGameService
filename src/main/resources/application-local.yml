# Same values as the Docker Compose .env.example, so the IDE run uses the Compose services (D-200).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gameservice
    username: gameservice
    password: gameservice
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    # Not guest: RabbitMQ accepts guest only over loopback, the published Compose port is not loopback (D-200).
    username: gameservice
    password: gameservice
springdoc:
  # /v3/api-docs and Swagger UI for local development only (D-56, D-174).
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
logging:
  structured:
    format:
      # Empty format = Boot's plain text pattern instead of the ECS JSON of application.yml (D-119).
      console: ""
